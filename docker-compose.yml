version: '3.8'

services:
  app:
    build: .
    container_name: orboretum-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - orboretum-network

  nginx:
    image: nginx:alpine
    container_name: orboretum-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - orboretum-network

networks:
  orboretum-network:
    driver: bridge
