name: Sync iNaturalist Collection

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Sync iNaturalist data
        run: python .github/scripts/sync_inaturalist.py

      - name: Commit changes
        run: |
          git config user.name "iNaturalist Sync Bot"
          git config user.email "noreply@orboretum.local"
          if git diff --quiet data/plant-accessions.json; then
            echo "No changes to commit"
          else
            git add data/plant-accessions.json
            git commit -m "Update plant accessions from iNaturalist"
            git push
          fi
